name: Build TAPSIN-VPN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath TAPSIN-VPN-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPSIN-VPN-Windows
          path: build/windows/x64/runner/Release/TAPSIN-VPN-Windows.zip

  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev fuse libfuse2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cat > AppDir/tapsin-vpn.desktop << EOF
          [Desktop Entry]
          Name=TAPSIN-VPN
          Exec=tapsin_vpn
          Icon=tapsin-vpn
          Type=Application
          Categories=Network;
          EOF
          cp assets/images/logo.png AppDir/tapsin-vpn.png 2>/dev/null || true
          ./appimagetool-x86_64.AppImage AppDir TAPSIN-VPN.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPSIN-VPN-Linux
          path: TAPSIN-VPN.AppImage

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPSIN-VPN-Android
          path: build/app/outputs/flutter-apk/app-*-release.apk

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TAPSIN-VPN-Windows/**
            TAPSIN-VPN-Linux/**
            TAPSIN-VPN-Android/**
          generate_release_notes: true
          body: |
            ## TAPSIN-VPN ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows | `TAPSIN-VPN-Windows.zip` |
            | Linux | `TAPSIN-VPN.AppImage` |
            | Android | `app-arm64-v8a-release.apk` (recommended) |

            ### How to connect
            1. Open the app → Add Profile
            2. Enter your subscription token
            3. Connect!
