name: Build TAPSIN-VPN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Prepare native Windows binaries
        shell: bash
        run: |
          mkdir -p hiddify-core/bin
          cp windows-deps/hiddify-core.dll hiddify-core/bin/
          cp windows-deps/HiddifyCli.exe hiddify-core/bin/
          cp windows-deps/libcronet.dll hiddify-core/bin/
          ls -lh hiddify-core/bin/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run slang && dart run build_runner build

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: powershell
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath tapsin-vpn-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPSIN-VPN-Windows
          path: build/windows/x64/runner/Release/tapsin-vpn-windows.zip

  build-linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev fuse libfuse2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run slang && dart run build_runner build

      - name: Build Linux
        run: flutter build linux --release

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cat > AppDir/tapsin-vpn.desktop << 'EOF'
          [Desktop Entry]
          Name=Tapsin VPN
          Exec=hiddify
          Icon=tapsin-vpn
          Type=Application
          Categories=Network;
          EOF
          cp assets/images/source/ic_launcher_border.png AppDir/tapsin-vpn.png 2>/dev/null || true
          cat > AppDir/AppRun << 'SCRIPT'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/hiddify" "$@"
          SCRIPT
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir tapsin-vpn.AppImage

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPSIN-VPN-Linux
          path: tapsin-vpn.AppImage

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run slang && dart run build_runner build

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAPSIN-VPN-Android
          path: build/app/outputs/flutter-apk/app-*-release.apk

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TAPSIN-VPN-Windows/**
            TAPSIN-VPN-Linux/**
            TAPSIN-VPN-Android/**
          generate_release_notes: true
